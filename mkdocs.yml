site_name: Compactador Huffman

repo_url: https://github.com/projeto-de-algoritmos-2026/G15_Greedy_PA-26.2
repo_name: G15_Greedy_PA-26.2

site_url: https://projeto-de-algoritmos-2026.github.io/G15_Greedy_PA-26.2/

nav:
  - Início: index.md
  - Protótipo: figma.md
  - Estrutura: estrutura.md
  - Algoritmo: algoritmo.md
  - Desenvolvedores: desenvolvedores.md
  - Vídeo: video.md

theme:
  name: material
  language: pt-BR
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Modo Noturno
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Modo Claro

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
