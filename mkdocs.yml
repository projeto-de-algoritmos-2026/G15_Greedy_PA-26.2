site_name: Trabalho grafo 2

repo_url: https://github.com/projeto-de-algoritmos-2026/G15_Greedy_PA-26.2
repo_name: G15_Greedy_PA-26.2

site_url: https://github.com/projeto-de-algoritmos-2026/G15_Greedy_PA-26.2/

nav:
  - Home: index.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Modo Noturno
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Modo Claro

markdown_extensions:
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - attr_list